%YAML 1.3
---
- MouseGesture: [Smart Shift, Mouse Left]
- KeyPress:
  - [Control_L, Alt_L, Left]
  - click
...
---
- MouseGesture: [Smart Shift, Mouse Right]
- KeyPress:
  - [Control_L, Alt_L, Right]
  - click
...
---
- Key: [Back Button, pressed]
- Or:
  - Process: org.gnome.Ptyxis
  - Process: Ptyxis
- KeyPress:
  - [Control_L, Shift_L, c]
  - click
...
---
- Key: [Back Button, pressed]
- KeyPress:
  - [Control_L, c]
  - click
...
---
- Key: [Forward Button, pressed]
- Or:
  - Process: org.gnome.Ptyxis
  - Process: Ptyxis
- KeyPress:
  - [Control_L, Shift_L, v]
  - click
...
---
- Key: [Forward Button, pressed]
- KeyPress:
  - [Control_L, v]
  - click
...
